[package]
name = "darkcall-native-gate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
darkcall-auction-core = { path = "../auction-core" }
darkcall-output-binding = { path = "../output-binding" }
darkcall-bn254-emulation = { path = "../bn254-emulation" }
darkcall-settlement-types = { path = "../settlement-types" }
darkcall-wallet-bridge = { path = "../wallet-bridge" }
group = "=0.13.0"
ff = "=0.13.1"
incrementalmerkletree = "=0.8.2"
orchard = { version = "=0.15.5", features = ["unstable-frost"] }
pasta_curves = "=0.5.2"
pczt = { version = "=0.8.0-rc.1", features = ["zcp-builder", "io-finalizer", "prover", "signer", "tx-extractor"] }
rand = "0.8"
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "=0.2.190"
zcash_primitives = "=0.29.0"
zcash_protocol = "=0.10.0"
