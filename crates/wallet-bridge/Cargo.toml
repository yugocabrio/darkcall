[package]
name = "darkcall-wallet-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
darkcall-auction-core = { path = "../auction-core" }
hex = "=0.4.3"
libc = "=0.2.190"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "=0.14.2", default-features = false, features = ["transport", "tls-webpki-roots", "tls-ring"] }
zcash_client_backend = { version = "=0.24.0-rc.1", default-features = false, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_protocol = "=0.10.0"
