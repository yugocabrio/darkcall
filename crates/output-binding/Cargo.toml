[package]
name = "darkcall-output-binding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "darkcall-output-binding"

[dependencies]
ff = "=0.13.1"
group = "=0.13.0"
halo2_gadgets = "=0.5.0"
halo2_proofs = "=0.3.5"
orchard = { version = "=0.15.5", features = ["unstable-voting-circuits"] }
pasta_curves = "=0.5.2"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
darkcall-sha-link = { path = "../sha-link" }
