[package]
name = "darkcall-nu7-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

# Deliberately separate from the working NU6.3 workspace and lockfile.
[workspace]

[dependencies]
darkcall-wallet-protocol = { path = "../../crates/wallet-protocol" }
darkcall-auction-core = { path = "../../crates/auction-core" }
darkcall-input-tool = { path = "../../crates/input-tool" }
ed25519-dalek = "=2.2.0"
ff = "=0.14.0"
group = "=0.14.0"
hex = "=0.4.3"
incrementalmerkletree = "=0.9.0"
orchard = { version = "=0.16.0", features = ["unstable-frost", "unstable-voting-circuits"] }
# Byte-level compatibility with the working binding/scanner stack. Never share
# Rust field/group types across these versions or change the main lockfile here.
orchard_old = { package = "orchard", git = "https://github.com/conradoplg/orchard.git", rev = "42015f15733b95e179189628d6fa34d92b5b3b8b", default-features = false, features = ["unstable-voting-circuits"] }
ff_old = { package = "ff", version = "=0.13.1" }
pasta_curves = "=0.6.0"
rand = { version = "=0.10.0", features = ["sys_rng", "thread_rng"] }
rand_old = { package = "rand", version = "=0.8.5" }
reddsa_frost = { package = "reddsa", git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
serde_json = "=1.0.149"
serde = { version = "=1.0.229", features = ["derive"] }
libc = "=0.2.190"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "=0.14.2", default-features = false, features = ["transport", "tls-webpki-roots", "tls-ring"] }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "9c5705f56517c040c50f96d29f1ff15a9383f3e0", features = ["zcp-builder", "io-finalizer", "prover", "signer", "tx-extractor"] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "9c5705f56517c040c50f96d29f1ff15a9383f3e0", default-features = false, features = ["orchard", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "9c5705f56517c040c50f96d29f1ff15a9383f3e0" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "9c5705f56517c040c50f96d29f1ff15a9383f3e0" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "9c5705f56517c040c50f96d29f1ff15a9383f3e0" }

[patch.crates-io]
# The reused off-chain claim/receipt/journal library keeps the exact old SDK.
# Only canonical note/FVK/commitment bytes cross the two native SDK families.
orchard = { git = "https://github.com/conradoplg/orchard.git", rev = "42015f15733b95e179189628d6fa34d92b5b3b8b" }

[profile.release]
debug = 0
strip = "debuginfo"
incremental = false
